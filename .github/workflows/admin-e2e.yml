name: Admin e2e (MySQL)

# MANUAL TRIGGER ONLY (ROADMAP W1-6 / D9, budget shape agreed 2026-08-19).
#
# This job is the expensive one: a MySQL service container, migrations, a seed
# import, a production build and a browser. Running it on every PR would cost
# more minutes than everything else in this repo combined, and almost every PR
# does not touch the admin.
#
# Run it from the Actions tab (or `gh workflow run admin-e2e.yml`) before
# merging anything that touches `/admin`, `lib/db/*` or `lib/auth/*`, and after
# any autonomous batch of admin work. It is also runnable locally against any
# MySQL — see README → Testing.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or SHA to test
        required: false
        default: main

concurrency:
  group: admin-e2e
  cancel-in-progress: true

jobs:
  admin-e2e:
    name: Login, listing CRUD, review moderation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: e2e
          MYSQL_DATABASE: negocio_e2e
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pe2e"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: mysql://root:e2e@127.0.0.1:3306/negocio_e2e
      # A throwaway secret for a throwaway database. The app refuses to boot
      # without one (by design), and it must be at least 32 characters.
      SESSION_SECRET: e2e-session-secret-not-a-real-one-0123456789
      # Read at BUILD time, so it has to be in the job env, not just the step.
      NEXT_PUBLIC_REVIEWS_ENABLED: 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      # Exactly the two commands a human runs against production, in the same
      # order (README → Database). If a migration is broken this fails here,
      # which is the whole point of running them rather than loading a dump.
      - name: Apply migrations
        run: npm run db:migrate

      - name: Import the seed data
        run: npm run db:import-seed

      # bootstrap-admin prints the generated password exactly once and refuses
      # to run if an active admin already exists — so it is captured from
      # stdout here rather than being set to something known.
      - name: Bootstrap the administrator
        run: |
          set -euo pipefail
          out=$(npm run --silent bootstrap-admin -- --email e2e@negocio.com.py --name "E2E Admin")
          echo "$out" | sed 's/password: .*/password: ***/'
          password=$(echo "$out" | sed -n 's/^ *password: *//p')
          if [ -z "$password" ]; then
            echo "::error::could not read the generated password from bootstrap-admin output"
            exit 1
          fi
          echo "::add-mask::$password"
          echo "E2E_ADMIN_EMAIL=e2e@negocio.com.py" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Admin round-trip
        run: npm run test:e2e:admin

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: admin-e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
