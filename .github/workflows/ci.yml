name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      # Mirrors Hostinger's production install so a broken build is caught here,
      # not at deploy time.
      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
